# Рыночное наложение: целевая аудитория «системные мыслители» (пример ЦА, Ф9).
# see LS.OVL.market. ЦА = тон-пресет под сегмент аудитории, НЕ отдельный стиль (peer-сессия 2026-06-11-37).
# Накладывается на регистр поста/руководства, когда market=systems-thinkers.
market: systems-thinkers
audience_segment: practitioner
# Канальный gate (peer-сессия 2026-06-12-02): ЦА-сегмент применяется только к исходящему
# контенту. Gate по запрошенному key["channel"]; в ide-чате наложение НЕ применяется.
applies_to:
  channel: [post, guide]
tone_overrides:
  formality: +1
  enthusiasm: 0
jargon_whitelist:           # термины, которые эта ЦА употребляет сама → без перевода
  - система
  - роль
  - метод
  - граница
