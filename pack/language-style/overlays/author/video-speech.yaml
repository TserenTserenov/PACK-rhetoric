# Авторское наложение L1 (видеоречь, короткие ролики). see DP.SC.173, WP-433.
# content-bearing: указатель на владельца контента, компилятор его materialize (не render).
# Слой каскада base → domain → market → genre → [author] → user. Опционален (applies_to не матчит → пропуск).
# ИНВАРИАНТ (OwnerIntegrity): это УКАЗАТЕЛЬ на content_source, НЕ копия правил.
# Источник один (DS-Tseren-Brand/style/video.md, стиль 3.1). Голос — отдельное наложение voice.yaml (WP-619 Ф5);
# события «video» в диспетчере пока нет, поэтому в рантайме видео-наложения не срабатывают.
overlay_class: author
overlay_type: content
content_source: L1.video-speech   # DS-Tseren-Brand/style/video.md
applies_to:
  channel: [video]
